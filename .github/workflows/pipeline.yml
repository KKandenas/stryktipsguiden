name: Pipeline

# Cron körs i UTC. Kommentarerna visar svensk tid som "sommartid / vintertid".
# Varje körning gör det som är aktuellt (python -m pipeline auto), så en extra
# eller försenad körning är ofarlig. Stängda omgångar hämtas om i upp till 48 h
# så att slutstrecken kommer med även om lördagskörningen blir sen.
on:
  schedule:
    - cron: "0 17 * * 4"    # tor 19:00 / 18:00  – ny kupong, streck, odds
    - cron: "0 12 * * 6"    # lör 14:00 / 13:00  – streck och odds
    - cron: "0 13 * * 6"    # lör 15:00 / 14:00
    - cron: "25 13 * * 6"   # lör 15:25 / 14:25  – sista försök före spelstopp sommartid
    - cron: "20 14 * * 6"   # lör 16:20 / 15:20  – sista före spelstopp vintertid / slutstreck sommartid
    - cron: "0 8 * * 0"     # sön 10:00 / 09:00  – resultat och utdelning
    - cron: "0 18 * * 0"    # sön 20:00 / 19:00  – resultat för sena matcher
  workflow_dispatch:
    inputs:
      kommando:
        description: "Vad ska köras?"
        type: choice
        default: auto
        options: [auto, svenskaspel, odds, resultat, tips, kommentarer, backfill]
      fran:
        description: "backfill: första omgång (t.ex. 4900)"
        required: false
      till:
        description: "backfill: sista omgång (t.ex. 4973)"
        required: false

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  kor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Cachade sidor från tipssajter (data/cache committas inte).
      - uses: actions/cache@v5
        with:
          path: data/cache
          key: sidcache-${{ github.run_id }}
          restore-keys: sidcache-

      - name: Kör pipelinen
        id: pipeline
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELL: ${{ vars.GEMINI_MODELL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KOMMANDO: ${{ inputs.kommando || 'auto' }}
          FRAN: ${{ inputs.fran }}
          TILL: ${{ inputs.till }}
        run: |
          if [ "$KOMMANDO" = "backfill" ]; then
            python -m pipeline backfill "$FRAN" "$TILL"
          else
            python -m pipeline "$KOMMANDO"
          fi

      # Committa även om ett steg misslyckades: det som sparats är validerat.
      - name: Committa ny data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/*.json
          if git diff --cached --quiet; then
            echo "Ingen ny data."
          else
            git commit -m "Data: $(date -u +'%Y-%m-%d %H:%M') UTC (${{ inputs.kommando || 'schema' }})"
            git pull --rebase
            git push
          fi

      - name: Markera körningen som misslyckad
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::Minst ett kritiskt steg misslyckades – se loggen för 'Kör pipelinen'."
          exit 1

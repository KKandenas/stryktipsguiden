name: Pipeline

# GitHubs schemalagda körningar kan bli flera timmar sena eller utebli. Därför startas pipelinen
# varje timme (och var 20:e minut på lördagar) med kommandot `planerad`. Den gör en riktig uppdatering
# bara när en tid i pipeline/schema.py (svensk tid) har passerats och inte körts än – annars avslutas den
# direkt utan att anropa några API:er eller ändra någon data. Udda minuter, eftersom GitHub är mest
# belastat på hela timmar.
#
# GitHub hoppar ändå över många schemalagda starter (i oktober 2026 kördes ungefär var fjärde). Därför
# startas pipelinen också var 15:e minut utifrån, av cron-job.org via GitHubs API (workflow_dispatch utan
# parametrar = `planerad`). Se README, "Extern start".
on:
  schedule:
    - cron: "17 * * * *"          # varje timme
    - cron: "37,57 8-15 * * 6"    # lördagar 10–17 / 09–16 svensk tid: tätare inför spelstopp
    - cron: "37,57 8-15 * * 0"    # söndagar likadant, för omgångar som stänger på söndagen
  workflow_dispatch:
    inputs:
      kommando:
        description: "Vad ska köras?"
        type: choice
        default: planerad       # externa starter utan parametrar får aldrig bli en full körning
        options: [planerad, auto, svenskaspel, odds, resultat, tips, sidomatcher, expertarkiv, expertteman, kommentarer, lagkoll, tabeller, backfill]
      fran:
        description: "backfill: första omgång (t.ex. 4900)"
        required: false
      till:
        description: "backfill: sista omgång (t.ex. 4973)"
        required: false

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  kor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Cachade sidor från tipssajter (data/cache committas inte).
      - uses: actions/cache@v5
        with:
          path: data/cache
          key: sidcache-${{ github.run_id }}
          restore-keys: sidcache-

      - name: Kör pipelinen
        id: pipeline
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELL: ${{ vars.GEMINI_MODELL }}
          GEMINI_RESERVMODELLER: ${{ vars.GEMINI_RESERVMODELLER }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KOMMANDO: ${{ inputs.kommando || 'planerad' }}
          FRAN: ${{ inputs.fran }}
          TILL: ${{ inputs.till }}
        run: |
          if [ "$KOMMANDO" = "backfill" ]; then
            python -m pipeline backfill "$FRAN" "$TILL"
          else
            python -m pipeline "$KOMMANDO"
          fi

      # Committa även om ett steg misslyckades: det som sparats är validerat.
      - name: Committa ny data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/*.json
          if git diff --cached --quiet; then
            echo "Ingen ny data."
          else
            git commit -m "Data: $(date -u +'%Y-%m-%d %H:%M') UTC (${{ inputs.kommando || 'schema' }})"
            git pull --rebase
            git push
          fi

      - name: Markera körningen som misslyckad
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::Minst ett kritiskt steg misslyckades – se loggen för 'Kör pipelinen'."
          exit 1

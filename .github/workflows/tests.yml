name: Tester

on:
  push:
    paths-ignore: ["data/**", "docs/kupong.json"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # Modultesterna, kontrollen av odefinierade namn i docs/*.js (identifierare.test.mjs) och röktestet som
      # laddar index.html + app.js i omgångens alla lägen (app.test.mjs, app-demo.test.mjs)
      - name: JS-tester och röktest av appen
        run: node --test tests/js/*.test.mjs
